name: Validate ontology

on:
  push:
    paths:
      - "ontology/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib
      - run: python scripts/validate.py
